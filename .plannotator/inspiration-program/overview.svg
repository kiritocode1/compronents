  <text x="465" y="134" fill="#999" font-size="10" text-anchor="middle">tests green</text>
  <line x1="118" y1="110" x2="142" y2="110" stroke="#555"/>
  <line x1="252" y1="110" x2="276" y2="110" stroke="#555"/>
  <line x1="386" y1="110" x2="410" y2="110" stroke="#555"/>
  <text x="320" y="30" fill="#fff" font-size="14" text-anchor="middle">Inspiration program: content, learning, surface</text>
  <text x="320" y="180" fill="#999" font-size="11" text-anchor="middle">Each phase ends in a numeric, checkable state before the next begins.</text>
