<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" font-family="sans-serif">
  <rect x="8" y="80" width="110" height="60" rx="8" fill="#111" stroke="#555"/>
  <text x="63" y="105" fill="#fff" font-size="12" text-anchor="middle">A. Content</text>
  <text x="63" y="122" fill="#999" font-size="10" text-anchor="middle">passages live</text>
  <text x="63" y="134" fill="#999" font-size="10" text-anchor="middle">misses logged</text>
  <rect x="142" y="80" width="110" height="60" rx="8" fill="#111" stroke="#555"/>
  <text x="197" y="105" fill="#fff" font-size="12" text-anchor="middle">B. Learning</text>
  <text x="197" y="122" fill="#999" font-size="10" text-anchor="middle">feedback + free rerank</text>
  <text x="197" y="134" fill="#999" font-size="10" text-anchor="middle">freshness kept</text>
  <rect x="276" y="80" width="110" height="60" rx="8" fill="#111" stroke="#555"/>
  <text x="331" y="105" fill="#fff" font-size="12" text-anchor="middle">C. Surface</text>
  <text x="331" y="122" fill="#999" font-size="10" text-anchor="middle">kind payloads</text>
