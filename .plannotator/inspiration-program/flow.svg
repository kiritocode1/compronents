<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" font-family="sans-serif">
  <text x="160" y="24" fill="#fff" font-size="13" text-anchor="middle">Before: catalog text only</text>
  <rect x="30" y="40" width="130" height="44" rx="8" fill="#1a1a1a" stroke="#555"/>
  <text x="95" y="58" fill="#fff" font-size="11" text-anchor="middle">agent query</text>
  <text x="95" y="72" fill="#999" font-size="10" text-anchor="middle">lexical + semantic</text>
  <rect x="30" y="100" width="130" height="44" rx="8" fill="#1a1a1a" stroke="#555"/>
  <text x="95" y="118" fill="#fff" font-size="11" text-anchor="middle">1,518 descriptions</text>
  <text x="95" y="132" fill="#999" font-size="10" text-anchor="middle">passages: 0 rows</text>
  <rect x="30" y="160" width="130" height="44" rx="8" fill="#1a1a1a" stroke="#555"/>
  <text x="95" y="178" fill="#fff" font-size="11" text-anchor="middle">bare hits</text>
  <text x="95" y="192" fill="#999" font-size="10" text-anchor="middle">misses vanish</text>
  <text x="95" y="230" fill="#999" font-size="11" text-anchor="middle">feedback write-only</text>
  <text x="480" y="24" fill="#fff" font-size="13" text-anchor="middle">After: content + learning</text>
  <rect x="350" y="40" width="130" height="44" rx="8" fill="#0a2a12" stroke="#2a7a3a"/>
  <text x="415" y="58" fill="#fff" font-size="11" text-anchor="middle">agent query</text>
  <text x="415" y="72" fill="#999" font-size="10" text-anchor="middle">+ passage vectors</text>
  <rect x="350" y="100" width="130" height="44" rx="8" fill="#0a2a12" stroke="#2a7a3a"/>
  <text x="415" y="118" fill="#fff" font-size="11" text-anchor="middle">passages filled</text>
  <text x="415" y="132" fill="#999" font-size="10" text-anchor="middle">feedback boosts</text>
  <rect x="350" y="160" width="130" height="44" rx="8" fill="#0a2a12" stroke="#2a7a3a"/>
  <text x="415" y="178" fill="#fff" font-size="11" text-anchor="middle">kind payloads</text>
  <text x="415" y="192" fill="#999" font-size="10" text-anchor="middle">misses logged</text>
  <text x="415" y="230" fill="#999" font-size="11" text-anchor="middle">misses become backlog</text>
  <line x1="95" y1="84" x2="95" y2="100" stroke="#555"/>
  <line x1="95" y1="144" x2="95" y2="160" stroke="#555"/>
  <line x1="415" y1="84" x2="415" y2="100" stroke="#555"/>
  <line x1="415" y1="144" x2="415" y2="160" stroke="#555"/>
  <text x="320" y="270" fill="#999" font-size="11" text-anchor="middle">Same endpoints, same weights. New rows, new logs, richer hits.</text>
</svg>
