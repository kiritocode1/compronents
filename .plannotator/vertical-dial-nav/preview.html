<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertical dial nav, isolated preview</title><style>
@font-face{font-family:Geist;src:url(https://fonts.gstatic.com/s/geist/v3/gyBhhwUxId8gMGYQMKR3pzfaWI_RruM4mJPby1QNtA.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;font-family:Geist,sans-serif}.dial-shell{position:fixed;right:0;top:50%;transform:translateY(-50%);width:200px;height:430px;z-index:9;mix-blend-mode:luminosity}nav{width:180px;height:100%;min-width:180px;background:none;border-radius:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;box-shadow:none}.links{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:12px;scrollbar-width:none;padding-right:8px}.links a{color:#000;font-family:Geist,sans-serif;font-size:16px;font-style:normal;font-weight:400;letter-spacing:-.05em;line-height:1;text-align:right;opacity:.2;transition:opacity .4s cubic-bezier(.4,0,.2,1),color .4s cubic-bezier(.4,0,.2,1),transform .4s cubic-bezier(.4,0,.2,1),font-variation-settings .4s cubic-bezier(.4,0,.2,1);padding:0;width:100%;cursor:pointer;user-select:none;text-decoration:none;font-variation-settings:"wght" 400;border-radius:6px;background:transparent;outline:none;transform:scale(1);-webkit-font-smoothing:antialiased;will-change:opacity,color,transform,font-variation-settings;min-height:0;margin:0}section{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}h1{font-size:100px;font-weight:500;letter-spacing:-.04em;line-height:1.1;text-align:center;margin:0;color:#191919;user-select:none}@media(max-width:1199px){h1{font-size:82px}}@media(max-width:809px){h1{font-size:36px}} 
</style></head><body><div class="dial-shell"><nav aria-label="Section navigation"><div class="links" tabindex="0"></div></nav></div><main></main><script>
const labels=['AI Coder','3D Generalist','Digital Artist','Product Designer','Detail Obsesed','Curious'];
const colors=['#e3e3e3','#ebc3c3','#ede6ad','#a6edd2','#a7a3e6','#e8a9dd'];
const links=document.querySelector('.links');const main=document.querySelector('main');
labels.forEach((label,index)=>{const id=String(index+1).padStart(2,'0');const a=document.createElement('a');a.href='#'+id;a.textContent=label;links.append(a);const section=document.createElement('section');section.id=id;section.style.background=colors[index];const h=document.createElement('h1');h.textContent=index===4?'Detail Obessed':label;section.append(h);main.append(section);a.addEventListener('click',event=>{event.preventDefault();section.scrollIntoView({behavior:'smooth',block:'start'});select(index)});});
let active=-1;function select(index){if(index===active)return;active=index;[...links.children].forEach((a,i)=>{const distance=Math.abs(i-index);a.style.opacity=distance===0?1:distance>2?.2:1-distance/3*.8;a.style.color=i===index?'rgb(26,26,26)':'#000000';a.style.fontWeight=i===index?500:400;a.style.fontVariationSettings=i===index?'"wght" 500':'"wght" 400';a.style.transform=i===index?'scale(1.06)':'scale(1)';if(i===index)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});links.children[index].scrollIntoView({behavior:'smooth',block:'center'})}
let scheduled=false;function track(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{let index=0;[...main.children].forEach((section,i)=>{if(section.getBoundingClientRect().top<=innerHeight*.3)index=i});select(index);scheduled=false})}addEventListener('scroll',track,{passive:true});track();
</script></body></html>
