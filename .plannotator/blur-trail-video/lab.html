<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blur trail lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; }
  #host { position: relative; height: 100svh; background: #222; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  video { display: none; }
</style>
</head>
<body>
<section id="host"><canvas></canvas></section>
<video src="https://ui.aryank.space/assets/blur-trail-video/bg.mp4" crossorigin="anonymous" autoplay muted loop playsinline></video>
<script type="module">
  import { createBlurTrail } from "./engine.js";
  const host = document.getElementById("host");
  const video = document.querySelector("video");
  const params = new URLSearchParams(location.search);
  const options = {};
  if (params.has("view")) options.debugView = params.get("view");
  if (params.has("gamma")) options.videoGamma = Number(params.get("gamma"));
  if (params.has("angle")) options.shiftAngle = Number(params.get("angle"));
  video.play().catch(() => {});
  window.__dispose = createBlurTrail({ canvas: host.querySelector("canvas"), host, video, options });
</script>
</body>
</html>
