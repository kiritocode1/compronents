<div data-tg="app" style="position:fixed;inset:0;background:{{ pageBg }};cursor:text;font-family:'DM Mono',ui-monospace,monospace" sc-camel-on-pointer-down="{{ focus }}" sc-camel-on-click="{{ tapFocus }}">
  <canvas ref="{{ cv }}" style="position:absolute;inset:0;width:100%;height:100%;display:{{ typeDisplay }}"></canvas>
  <input ref="{{ inp }}" data-tg="input" sc-camel-on-input="{{ onInput }}" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none">

  <div data-tg="modes" style="position:absolute;top:16px;right:16px;z-index:5;display:flex;gap:4px;padding:4px;border:1px solid #2A2A2A;border-radius:999px;background:#000">
    <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
      <button sc-camel-on-click="{{ m.pick }}" style="border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;letter-spacing:0.04em;cursor:pointer;background:{{ m.bg }};color:{{ m.fg }}">{{ m.label }}</button>
    </sc-for>
  </div>

  <sc-if value="{{ showTypeHint }}" hint-placeholder-val="{{ true }}">
    <div data-tg="bar" style="position:absolute;left:24px;right:24px;bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:0.04em;color:{{ hintCol }};opacity:0.6">
      <div data-tg="hints" style="display:flex;gap:20px;flex-wrap:wrap">
        <span data-tg="fine">type to grow</span><span data-tg="coarse">tap to type</span>
        <span>space cuts</span>
        <span data-tg="fine">backspace withers</span><span data-tg="coarse">⌫ withers</span>
        <span data-tg="fine">enter clears</span><span data-tg="coarse">return clears</span>
      </div>
      <div data-tg="ctrls" style="display:flex;gap:8px;align-items:center">
        <div data-tg="pal" style="display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3A3A3A;border-radius:999px;background:{{ pageBg }}">
          <sc-for list="{{ palettes }}" as="p" hint-placeholder-count="10">
            <button data-tg="sw" sc-camel-on-click="{{ p.pick }}" aria-label="{{ p.name }}" title="{{ p.name }}" style="width:22px;height:22px;padding:0;border-radius:999px;cursor:pointer;background:{{ p.bg }};border:1.5px solid {{ p.ring }};display:flex;align-items:center;justify-content:center;transform:scale({{ p.scale }})" style-hover="transform:scale(1.15)">
              <span data-tg="dot" style="width:10px;height:10px;border-radius:999px;background:{{ p.flower }}"></span>
            </button>
          </sc-for>
        </div>
        <button data-tg="btn" sc-camel-on-click="{{ savePNG }}" style="background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer" style-hover="border-color:#FFFFFF;color:#FFFFFF">PNG</button>
        <button data-tg="btn" sc-camel-on-click="{{ saveSVG }}" style="background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer" style-hover="border-color:#FFFFFF;color:#FFFFFF">SVG</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isPoster }}" hint-placeholder-val="{{ false }}">
    <div data-tg="poster" style="position:absolute;inset:0;display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#000;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:0.03em">
      <div data-tg="panel" style="border-right:1px solid #1E1E1E;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#0A0A0A">
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="font-family:'GT Ultra','Playfair Display',serif;font-weight:700;font-size:26px;letter-spacing:0;color:#FFFFFF">Poster</div>
          <div style="color:#8C8C8C">{{ infoLabel }}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Words</div>
          <input value="{{ pText }}" sc-camel-on-change="{{ onText }}" spellcheck="false" style="background:#000;border:1px solid #2A2A2A;border-radius:10px;color:#FFFFFF;font-family:'GT Ultra','Playfair Display',serif;font-weight:700;font-size:22px;padding:10px 12px;outline:none" style-focus="border-color:#FFFFFF">
          <button sc-camel-on-click="{{ reshuffle }}" style="align-self:flex-start;background:transparent;border:1px solid #2A2A2A;color:#EDEDED;font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer" style-hover="border-color:#FFFFFF">Regrow garden</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Motion</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
              <button sc-camel-on-click="{{ p.pick }}" style="text-align:left;background:{{ p.bg }};border:1px solid {{ p.border }};color:#FFFFFF;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px">
                <span style="font-size:13px">{{ p.label }}</span>
                <span style="color:#8C8C8C;font-size:11px">{{ p.sub }}</span>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Palette</div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
            <sc-for list="{{ palettes }}" as="p" hint-placeholder-count="10">
              <button sc-camel-on-click="{{ p.pick }}" aria-label="{{ p.name }}" style="display:flex;flex-direction:column;gap:8px;align-items:stretch;background:transparent;border:1px solid {{ p.border }};color:#EDEDED;font:inherit;padding:6px 6px 8px;border-radius:12px;cursor:pointer;text-align:left" style-hover="border-color:#8C8C8C">
                <span style="display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;background:{{ p.bg }}">
                  <span style="width:18px;height:18px;border-radius:50%;background:{{ p.flower }}"></span>
                  <span style="width:12px;height:12px;border-radius:50%;background:{{ p.stem }};margin-left:-4px"></span>
                  <span style="font-family:'GT Ultra','Playfair Display',serif;font-weight:700;font-size:18px;color:{{ p.text }};margin-left:8px">Aa</span>
                </span>
                <span style="padding:0 4px">{{ p.name }}</span>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #1E1E1E;padding-top:20px">
          <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Export · 1080 × 1080 loop</div>
          <button sc-camel-on-click="{{ exportVideo }}" disabled="{{ busy }}" style="background:#FFFFFF;border:0;color:#000;font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer">{{ videoLabel }}</button>
          <button sc-camel-on-click="{{ exportFrames }}" disabled="{{ busy }}" style="background:transparent;border:1px solid #3A3A3A;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer" style-hover="border-color:#FFFFFF">PNG frames (.zip)</button>
          <div style="color:#8C8C8C;min-height:16px">{{ status }}</div>
        </div>
      </div>

      <div data-tg="stage" style="display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0">
        <canvas ref="{{ pcv }}" data-tg="pcanvas" width="1080" height="1080" style="width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1 / 1;display:block;border:1px solid #1E1E1E"></canvas>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

  // ---------- export ----------

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  savePNG() {

  }
  // ---------- SVG: type as shapes ----------

  }

      const b = ch.toLowerCase() !== ch.toUpperCase() ? ch : /[0-9]/.test(ch) ? 'digit-' + ch : 'glyph';
      seen[b] = (seen[b] || 0) + 1;

      onInput: e => this.inputDiff(e.target),

      pText: s.text,
      onText: e => this.upd({ text: e.target.value }),
      reshuffle: () => this.upd({ seed: Math.floor(Math.random() * 1e6) }),

      videoLabel: this.vmime ? (s.busy ? 'Exporting…' : `Export ${this.vmime.includes('mp4') ? 'MP4' : 'WebM'} loop`) : 'Video export unavailable',

  }
}
</script>




<style>
#tg-copy{position:fixed;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));-webkit-tap-highlight-color:transparent;z-index:6;font-family:'DM Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.04em}
#tg-copy[hidden]{display:none}

#tg-copy button{display:block;min-width:9ch;box-sizing:content-box;border:0;border-radius:999px;padding:7px 14px;font:inherit;text-align:center;background:transparent;color:#EDEDED;cursor:pointer;white-space:nowrap;transition:color .15s}
#tg-copy button:focus-visible{outline:1px solid #FFFFFF;outline-offset:2px}
@media (hover:hover){#tg-copy .pill:hover{border-color:#FFFFFF}#tg-copy .pill:hover button{color:#FFFFFF}}
#tg-copy .note{position:absolute;top:calc(100% + 10px);left:5px;white-space:nowrap;color:#8C8C8C;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s;pointer-events:none}
#tg-copy.on .note{opacity:1;transform:none}
</style>
<div id="tg-copy"><div class="pill"><button type="button" title="Copies the source with a short brief. Paste it into Claude to make your own.">Copy code</button></div><div class="note" aria-live="polite"></div></div>
<script>
(function () {
  var wrap = document.getElementById('tg-copy'), btn = wrap.querySelector('button'), note = wrap.querySelector('.note');
  var src = null, timer = 0;
  var load = fetch('/source.txt').then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  load.then(function (t) { src = t; }, function () {});
  function show(ok) {
    btn.textContent = ok ? 'Copied' : 'Copy code';
    note.textContent = ok ? 'Paste it into Claude to grow your own' : 'Couldn’t copy. Try again.';
    wrap.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function () { wrap.classList.remove('on'); btn.textContent = 'Copy code'; }, 2800);
  }
  function legacy(t) {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0'; document.body.appendChild(ta);
    ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
  }
  btn.addEventListener('click', function () {
    var cb = navigator.clipboard;
    if (src !== null) {
      if (cb && cb.writeText) cb.writeText(src).then(function () { show(true); }, function () { show(legacy(src)); });
      else show(legacy(src));
    } else if (cb && cb.write && window.ClipboardItem) {
      cb.write([new ClipboardItem({ 'text/plain': load.then(function (t) { return new Blob([t], { type: 'text/plain' }); }) })])
        .then(function () { show(true); }, function () { show(false); });
    } else {
      load.then(function (t) { show(legacy(t)); }, function () { show(false); });
    }
    btn.blur();
  });
  // Enter / Space on the button must not reach the garden (enter clears, space cuts)
  btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') e.stopPropagation(); });
  // Poster mode's side panel owns this corner, so step aside while it is open
  function sync() {
    var poster = Array.prototype.some.call(document.querySelectorAll('button'), function (b) { return b.textContent.trim() === 'Regrow garden'; });
    if (wrap.hidden !== poster) wrap.hidden = poster;
  }
  new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });
  sync();
})();
</script>
