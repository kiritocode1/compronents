<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patch Lab Experiment</title>
<meta name="description" content="Play with the Kables mark: hover to stir, drag to patch cables, and let the pattern make sound.">
<meta name="theme-color" content="#475e62">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Patch Lab Experiment">
<meta property="og:description" content="Hover to stir, drag to patch cables, and let the pattern make sound.">
<meta property="og:image" content="https://patch.nrly.fun/og.png">
<meta property="og:url" content="https://patch.nrly.fun/">
<link rel="canonical" href="https://patch.nrly.fun/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed shader canvas as the stage, one floating "module" faceplate of controls, a mono readout in the corner. Single deliberate brand look. */
:root{
  --slate:#4b5b5d;
  --lime:#e5f56b;
  --paper:#ebebe9;
  --panel:#f4f4f2;
  --glass:rgba(244,244,242,.7);
  --ink:#2c2c2b;
  --ink-soft:#6b6f6e;
  --line:rgba(44,44,43,.14);
  --canvas-bg:#4b5b5d;
  --canvas-fg:#e5f56b;
  --f-display:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono-track:.04em;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
html{background:var(--canvas-bg)}
body{background:var(--canvas-bg);color:var(--ink);font-family:var(--f-display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#stage.erasing{cursor:cell}

.module{position:fixed;z-index:5;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:max(16px,calc(16px + env(safe-area-inset-left,0px)));
  width:292px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow:auto;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.45);border-radius:18px;
  box-shadow:0 18px 50px -24px rgba(20,26,27,.55);display:flex;flex-direction:column}
.module-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.05}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:var(--mono-track);text-transform:uppercase;color:var(--ink-soft)}
.collapse{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;height:30px;padding:0 12px 0 9px;font:500 12px var(--f-display);cursor:pointer;flex:none;
  display:inline-flex;align-items:center;gap:6px}
.collapse svg{width:15px;height:15px;transition:transform .4s ease}
.collapse:hover svg{transform:rotate(60deg)}
@media (prefers-reduced-motion:reduce){.collapse svg{transition:none}}
.module-body{display:flex;flex-direction:column;gap:18px;padding:16px}
.module.closed .module-body{display:none}
.module.closed .module-head{border-bottom:0}

.group{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:var(--mono-track);text-transform:uppercase;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:baseline}
.label output{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:var(--mono-track)}

.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatch{appearance:none;border:1px solid var(--line);border-radius:10px;aspect-ratio:5/3;max-width:100%;cursor:pointer;
  position:relative;padding:0;display:grid;place-items:center;background:var(--sbg)}
.swatch::after{content:"";height:44%;width:auto;aspect-ratio:1;border-radius:50%;background:var(--sfg)}
.swatch.cable{border-radius:50%}
.swatch.cable::after{display:none}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

.fader{display:flex;flex-direction:column;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--slate) var(--p,50%),rgba(44,44,43,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(44,44,43,.14)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--slate)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;
  background:var(--lime);border:2px solid var(--slate)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--lime);border:2px solid var(--slate)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(44,44,43,.06);border-radius:10px;padding:3px;gap:3px}
.seg button,.btn{appearance:none;border:0;font:500 13px var(--f-display);color:var(--ink);cursor:pointer;border-radius:8px;height:32px}
.seg button{background:transparent}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg5{grid-template-columns:repeat(5,1fr)}
.seg5 button{padding:0 2px;font-size:12.5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.tlabel{font-size:13px;color:var(--ink)}
.switch{appearance:none;width:40px;height:22px;border-radius:999px;background:rgba(44,44,43,.18);position:relative;cursor:pointer;border:0;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.switch[aria-checked="true"]{background:var(--slate)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--lime)}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.group > .label:first-child{color:var(--ink);font-weight:500;letter-spacing:var(--mono-track)}
.genbox{background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:12px}
.gens{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip.gen{height:auto;min-height:46px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.4);
  flex-direction:column;align-items:flex-start;justify-content:center;padding:7px 10px;gap:2px;text-align:left}
.chip.gen::before{display:none}
.chip.gen:hover{background:rgba(255,255,255,.75)}
.chip.gen b{font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px}
.chip.gen b::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--slate);box-sizing:border-box;flex:none}
.chip.gen small{font-size:11px;line-height:1.25;color:var(--ink-soft)}
.chip.gen[aria-pressed="true"]{background:var(--slate);color:var(--lime);border-color:var(--slate)}
.chip.gen[aria-pressed="true"] small{color:rgba(229,245,107,.75)}
.chip.gen[aria-pressed="true"] b::before{background:var(--lime);border-color:var(--lime);animation:beat var(--beat,.56s) ease-out infinite}
.chip.gen.wide{grid-column:1/-1}
@keyframes beat{0%{transform:scale(1.6)}55%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.chip.gen[aria-pressed="true"] b::before{animation:none}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{background:rgba(44,44,43,.06);padding:0 10px}
.btn:hover{background:rgba(44,44,43,.11)}
.btn.primary{background:var(--slate);color:var(--lime)}
.btn.primary:hover{background:#3f4d4f}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:30px;
  font:500 12.5px var(--f-display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--slate);box-sizing:border-box}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--lime);border-color:var(--slate)}
.chip[aria-pressed="true"]::before{background:var(--lime);border-color:var(--lime)}
.hint{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin:0}
.hint kbd{font-family:var(--f-mono);letter-spacing:var(--mono-track);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--slate);outline-offset:2px}

.readout{position:fixed;z-index:4;right:max(16px,calc(16px + env(safe-area-inset-right,0px)));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  font-family:var(--f-mono);font-size:11px;letter-spacing:var(--mono-track);text-transform:uppercase;color:var(--canvas-fg);opacity:.75;
  font-variant-numeric:tabular-nums;pointer-events:none}

.reset{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,calc(16px + env(safe-area-inset-right,0px)));
  appearance:none;border:1px solid rgba(255,255,255,.45);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);color:var(--ink);border-radius:999px;height:52px;padding:0 22px 0 18px;
  display:flex;align-items:center;gap:10px;font:500 15px var(--f-display);cursor:pointer;box-shadow:0 18px 50px -24px rgba(20,26,27,.55);
  transition:transform .15s ease,background .15s ease}
.reset svg{width:20px;height:20px}
.reset.spin svg{transform:rotate(-360deg);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.reset:hover{background:rgba(255,255,255,.8)}
.reset:active{transform:scale(.96)}
.hint-pill{position:fixed;z-index:4;left:max(50%,500px);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;height:46px;padding:0 22px 0 5px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.45);box-shadow:0 18px 50px -24px rgba(20,26,27,.55);pointer-events:none;white-space:nowrap;
  opacity:0;transform:translate(-50%,10px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.hint-pill.show{opacity:1;transform:translate(-50%,0)}
.hint-pill.gone{opacity:0;transform:translate(-50%,10px) scale(.96)}
.hint-mark{width:36px;height:36px;border-radius:50%;background:#23383a;display:grid;place-items:center;flex:none}
.hint-mark svg{width:47%;height:47%}
.hint-text{font:500 13px var(--f-mono);letter-spacing:var(--mono-track);text-transform:uppercase;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.hint-pill{transition:opacity .3s ease;transform:translate(-50%,0)}}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,24,25,.62);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:min(920px,100%);max-height:100%;min-width:0}
.sheet img{display:block;max-width:100%;max-height:62vh;border-radius:10px;object-fit:contain;background:var(--paper)}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nogl{position:fixed;inset:0;display:grid;place-items:center;color:var(--lime);font-size:15px;text-align:center;padding:24px}

@media (max-width:640px){
  .hint-pill{left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));height:40px;gap:10px;padding-right:16px}
  .hint-mark{width:30px;height:30px}
  .hint-text{font-size:11px;letter-spacing:var(--mono-track)}
  .reset{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(12px,calc(12px + env(safe-area-inset-right,0px)))}
  .module{left:max(12px,calc(12px + env(safe-area-inset-left,0px)));right:max(12px,calc(12px + env(safe-area-inset-right,0px)));
    top:calc(12px + env(safe-area-inset-top,0px));width:auto;max-height:72%}
}

</style>
</head>
<body>

<canvas id="stage" aria-label="Kables pattern canvas. Hover to merge dots, drag to patch cables, click to send a ripple."></canvas>

<section class="module" id="module" aria-label="Pattern controls">
  <header class="module-head">
    <svg class="mark" viewBox="-62 -62 384 384" aria-hidden="true"><rect x="-62" y="-62" width="384" height="384" rx="84" fill="#4b5b5d"/><path fill="#e5f56b" d="M84.9434 216.135C84.9434 239.591 65.9281 258.606 42.4717 258.606C19.0152 258.606 0 239.591 0 216.135C0 192.678 19.0152 173.663 42.4717 173.663C65.9281 173.663 84.9434 192.678 84.9434 216.135ZM259.606 42.4717C259.606 65.9281 240.591 84.9434 217.135 84.9434L201.706 84.9434C192.153 84.9434 182.991 88.7384 176.236 95.4937C169.481 102.249 165.686 111.411 165.686 120.964L165.686 135.903C165.686 145.918 169.664 155.522 176.745 162.604C183.826 169.685 193.431 173.663 203.445 173.663L217.259 173.663C240.715 173.663 259.73 192.678 259.73 216.135C259.73 239.591 240.715 258.606 217.259 258.606C193.802 258.606 174.786 239.591 174.786 216.134L174.786 201.106C174.786 193.309 171.689 185.831 166.176 180.318C160.663 174.805 153.185 171.708 145.389 171.708L123.213 171.708C99.7564 171.708 80.7412 152.693 80.7412 129.236C80.7412 105.78 99.7564 86.7646 123.213 86.7646L143.965 86.7646C152.107 86.7646 159.915 83.5304 165.672 77.7734C171.429 72.0165 174.663 64.2083 174.663 56.0667V42.4717C174.663 19.0152 193.678 0 217.135 0C240.591 0 259.606 19.0152 259.606 42.4717ZM84.9434 42.4717C84.9434 65.9281 65.9281 84.9434 42.4717 84.9434C19.0152 84.9434 0 65.9281 0 42.4717C0 19.0152 19.0152 0 42.4717 0C65.9281 0 84.9434 19.0152 84.9434 42.4717Z"/></svg>
    <div class="brand"><b>Patch Lab</b><span>Kables</span></div>
    <button class="collapse" id="collapse" aria-expanded="true" aria-controls="moduleBody">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="collapseLbl">Hide</span>
    </button>
  </header>

  <div class="module-body" id="moduleBody">
    <div class="group">
      <div class="label">Palette <output id="palName">Dash of Lime</output></div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="group genbox">
      <div class="label">Generators <output id="genCount">Off</output></div>
      <div class="gens" role="group" aria-label="Generators">
        <button class="chip gen" data-fx="wander" aria-pressed="false"><b>Wander</b><small>Ghost cursor drifts</small></button>
        <button class="chip gen" data-fx="rain" aria-pressed="false"><b>Rain</b><small>Ripples on the beat</small></button>
        <button class="chip gen" data-fx="selfpatch" aria-pressed="false"><b>Patcher</b><small>Draws its own cables</small></button>
        <button class="chip gen" data-fx="lfo" aria-pressed="false"><b>LFO</b><small>Sweeping waves</small></button>
        <button class="chip gen wide" data-fx="seq" aria-pressed="false"><b>Sequencer</b><small>Steps across the grid and plays your patches</small></button>
      </div>
      <div class="fader"><div class="label"><label for="fBpm">Tempo</label><output id="oBpm"></output></div>
        <input type="range" id="fBpm" min="60" max="180" step="1" value="108"></div>
    </div>

    <div class="group">
      <div class="label">Sound</div>
      <div class="seg seg5" role="group" aria-label="Sound voice">
        <button data-voice="off" aria-pressed="false">Off</button>
        <button data-voice="mist" aria-pressed="true">Mist</button>
        <button data-voice="pluck" aria-pressed="false">Pluck</button>
        <button data-voice="bloop" aria-pressed="false">Bloop</button>
        <button data-voice="acid" aria-pressed="false">Acid</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Effects</div>
      <div class="chips" role="group" aria-label="Effects">
        <button class="chip" data-fx="magnet" aria-pressed="true">Magnet</button>
        <button class="chip" data-fx="ripples" aria-pressed="true">Ripples</button>
        <button class="chip" data-fx="breathe" aria-pressed="false">Breathe</button>
        <button class="chip" data-fx="sockets" aria-pressed="true">Sockets</button>
        <button class="chip" data-fx="signal" aria-pressed="true">Signal</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Cursor</div>
      <div class="fader"><div class="label"><label for="fReach">Reach</label><output id="oReach"></output></div>
        <input type="range" id="fReach" min="0.6" max="6" step="0.1" value="2.2"></div>
      <div class="fader"><div class="label"><label for="fSmooth">Smoothing</label><output id="oSmooth"></output></div>
        <input type="range" id="fSmooth" min="0" max="1" step="0.01" value="0.55"></div>
      <div class="fader"><div class="label"><label for="fTrail">Trail decay</label><output id="oTrail"></output></div>
        <input type="range" id="fTrail" min="0" max="3" step="0.05" value="1"></div>
    </div>

    <div class="group">
      <div class="label">Patching</div>
      <div class="seg" role="group" aria-label="Drag tool">
        <button id="tPatch" aria-pressed="true">Patch</button>
        <button id="tErase" aria-pressed="false">Unpatch</button>
      </div>
      <div class="toggle-row">
        <span class="tlabel" id="pFadeLbl">Fade patches after 5s</span>
        <button class="switch" id="pFade" role="switch" aria-checked="true" aria-labelledby="pFadeLbl"></button>
      </div>
      <div class="row3">
        <button class="btn" id="pLogo">K grid</button>
        <button class="btn" id="pBay">Patchbay</button>
        <button class="btn" id="pClear">Clear</button>
      </div>
      <p class="hint">Hover to merge, click to send a ripple, drag to patch cables. Hold <kbd>Shift</kbd> to swap tools.</p>
    </div>

    <div class="group">
      <div class="label">Shape</div>
      <div class="fader"><div class="label"><label for="fSpacing">Spacing</label><output id="oSpacing"></output></div>
        <input type="range" id="fSpacing" min="16" max="90" step="1" value="40"></div>
      <div class="fader"><div class="label"><label for="fSize">Dot size</label><output id="oSize"></output></div>
        <input type="range" id="fSize" min="0.28" max="0.62" step="0.01" value="0.47"></div>
      <div class="fader"><div class="label"><label for="fGoo">Goo</label><output id="oGoo"></output></div>
        <input type="range" id="fGoo" min="0" max="1" step="0.01" value="0.79"></div>
      <div class="fader"><div class="label"><label for="fMin">Min neck</label><output id="oMin"></output></div>
        <input type="range" id="fMin" min="0.2" max="1" step="0.01" value="0.62"></div>
    </div>

  </div>
</section>

<button class="reset" id="resetAll" aria-label="Clear all patches">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Clear patches
</button>

// Presets
function clearAll(){lastPreset=null;patched.fill(0);if(typeof FA!=="undefined"&&FA)FA.fill(0);}
function setCell(i,j,v,t){if(i<0||j<0||i>=N[0]||j>=N[1])return;const k=j*N[0]+i;patched[k]=v;ptime[k]=t||0;}
function stagger(i,j){return reduce?0:performance.now()+(i+j*.6)*16;}
let lastPreset=null;
// Lay the K tiling over the whole grid, leaving hand-drawn patches alone.
function tileLogo(animate){
  for(let k=0,n=patched.length;k<n;k++)if(patched[k]===1)patched[k]=0;
  const put=(i,j)=>{if(i<0||j<0||i>=N[0]||j>=N[1])return;if(patched[j*N[0]+i]!==2)setCell(i,j,1,animate?stagger(i,j):0);};
  for(let b=-1;b*4<N[1]+4;b++)for(let a=-1;a*4<N[0]+4;a++){
    const cx=4*a+2*(b&1)+1, cy=4*b+1;
    put(cx,cy);put(cx,cy-1);

}
function presetLogo(){clearAll();lastPreset="logo";tileLogo(true);}
function presetBay(){

  for(let c=0;c<count;c++){
    let x=Math.floor(Math.random()*N[0]),y=Math.floor(Math.random()*N[1]);
    if((x+y)&1)x+=1;
    let dx=Math.random()<.5?1:-1,dy=Math.random()<.5?1:-1;
    const len=2+Math.floor(Math.random()*6);
    for(let s=0;s<len;s++){
      if(Math.random()<.35)dy=-dy;
      setCell(Math.min(x,x+dx),Math.min(y,y+dy),1,stagger(x,y));
      x+=dx;y+=dy;
    }
  }
}

// Pointer
const ptr={sx:-99,sy:-99,sIn:false,amt:0,x:-99,y:-99,px:-99,py:-99,in:false,down:false,lx:0,ly:0,shift:false,moved:0};
const ripples=[];
function toLattice(e){const r=canvas.getBoundingClientRect();return[((e.clientX-r.left)*dpr-O[0])/sc,((e.clientY-r.top)*dpr-O[1])/sc];}
// Endpoint dots of cell (i,j) as cell indices (left end first), -1 if off-grid.
function ends(i,j){
  const nx=N[0],ny=N[1],id=(x,y)=>x>=0&&y>=0&&x<nx&&y<ny?y*nx+x:-1;
  return ((i+j)&1)===0?[id(i,j),id(i+1,j+1)]:[id(i,j+1),id(i+1,j)];

}
function paintSeg(x0,y0,x1,y1){

// Sound: a small plucked voice per cable that connects, pentatonic by position.
let analyser=null,scopeBuf=null,mistIn=null,ac=null,bus=null,lastNote=0,notesThisFrame=0;
function ensureAudio(){

const SCALE=[0,3,5,7,10];
const PLUCKS=["string","mallet","harp","fm","soft"];
const ksCache=new Map();
// Karplus-Strong plucked string, rendered once per pitch and cached.
function ks(fr,damp,bright){

  const b=ac.createBuffer(1,len,sr),d=b.getChannelData(0),ring=new Float32Array(P);
  let prev=0;for(let n=0;n<P;n++){const w=Math.random()*2-1;prev=prev*(1-bright)+w*bright+w*(1-bright)*.35;ring[n]=prev;}

    const a=ring[p],nx=ring[(p+1)%P];

function pluckVariant(kind,fr,vel,t0,dest){

  const run=(o,dur)=>{o.start(t0);o.stop(t0+dur+.05);};
  if(kind==="string"||kind==="harp"){
    const src=ac.createBufferSource();
    src.buffer=kind==="string"?ks(fr,.995,.25):ks(fr,.9985,.8);
    const g=env(vel*(kind==="string"?.9:.7),kind==="string"?.9:1.5);
    src.connect(g);src.start(t0);src.stop(t0+1.6);
  }else if(kind==="mallet"){
    const parts=[[1,.7,.55],[3.98,.28,.12],[9.2,.1,.04]];
    for(const [m,a,dec] of parts){const o=sine(fr*m);o.connect(env(vel*a,dec));run(o,dec);}
  }else if(kind==="fm"){
    const c=sine(fr),mo=sine(fr*3.5),mg=ac.createGain();
    mg.gain.setValueAtTime(fr*2.6*vel,t0);mg.gain.exponentialRampToValueAtTime(1,t0+.32);
    mo.connect(mg);mg.connect(c.frequency);c.connect(env(vel*.45,.75));run(c,.75);run(mo,.75);
  }else{
    const g=env(vel*.5,.55),o1=sine(fr,"triangle"),o2=sine(fr*2.003),g2=ac.createGain();g2.gain.value=.35;
    o1.connect(g);o2.connect(g2);g2.connect(g);run(o1,.55);run(o2,.55);
  }
}
function playVoice(i,j,force){
  if(!ac||ac.state!=="running")return;
  const now=ac.currentTime;
  if(!force&&(now-lastNote<(S.voice==="mist"?.14:.05)||notesThisFrame>0))return;
  lastNote=now;notesThisFrame++;
  const deg=((i+(N[1]-j)*2)%15+15)%15;
  const f=98*Math.pow(2,(SCALE[deg%5]+12*Math.floor(deg/5))/12);
  let out=bus;
  if(ac.createStereoPanner){const pan=ac.createStereoPanner();pan.pan.value=Math.max(-1,Math.min(1,(i/N[0])*2-1));pan.connect(bus);out=pan;}
  const g=ac.createGain();g.connect(out);
  const osc=(type,fr)=>{const o=ac.createOscillator();o.type=type;o.frequency.value=fr;return o;};
  if(S.voice==="pluck"){
    // Timbre changes in bands across the canvas; brightness follows height; small human variation per note.
    const vel=.55+Math.random()*.45, fr=f*(Math.random()<.14?2:1)*Math.pow(2,(Math.random()-.5)*.012);
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900+(1-j/N[1])*4200;lp.Q.value=.8;lp.connect(g);
    const kind=PLUCKS[((Math.floor(i/5)%PLUCKS.length)+PLUCKS.length)%PLUCKS.length];
    pluckVariant(kind,fr,vel,now,lp);
    if(Math.random()<.18)pluckVariant(kind,fr*1.5,vel*.45,now+.055,lp);   // occasional strummed fifth
  }else if(S.voice==="mist"){
    // Soft and slow: detuned sines on a major pentatonic, gentle attack, long fade into reverb.
    const MAJ=[0,2,4,7,9],dg=deg%10,fm=146.83*Math.pow(2,(MAJ[dg%5]+12*Math.floor(dg/5))/12);
    const vel=.6+Math.random()*.4;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1500;lp.Q.value=.3;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.2*vel,now+.08);g.gain.exponentialRampToValueAtTime(.0008,now+2.8);
    lp.connect(g);
    if(mistIn){const send=ac.createGain();send.gain.value=.8;g.connect(send);send.connect(mistIn);}
    const parts=[[fm,-4,1],[fm,4,1],[fm*2,0,.18],[fm/2,0,.25]];
    for(const [fq,cents,a] of parts){
      const o=osc("sine",fq*Math.pow(2,cents/1200)),ga=ac.createGain();ga.gain.value=a*.5;
      o.connect(ga);ga.connect(lp);o.start(now);o.stop(now+2.9);
    }
  }else if(S.voice==="bloop"){
    // Droplet: a sine that glides up as it fades.
    const o=osc("sine",f*.6);o.frequency.setValueAtTime(f*.6,now);o.frequency.exponentialRampToValueAtTime(f*1.45,now+.13);
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.75,now+.006);g.gain.exponentialRampToValueAtTime(.001,now+.3);
    o.connect(g);o.start(now);o.stop(now+.34);
  }else if(S.voice==="acid"){
    // Saw bass through a resonant lowpass with a snappy filter envelope.
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.Q.value=13;
    lp.frequency.setValueAtTime(f*9,now);lp.frequency.exponentialRampToValueAtTime(f*.9,now+.24);
    const o1=osc("sawtooth",f/2),o2=osc("sawtooth",f/2*1.006);
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.32,now+.005);g.gain.exponentialRampToValueAtTime(.001,now+.36);
    o1.connect(lp);o2.connect(lp);lp.connect(g);
    o1.start(now);o2.start(now);o1.stop(now+.4);o2.stop(now+.4);
  }
}

// Frame

  return Math.hypot(px-ax-dx*t,py-ay-dy*t);
}
const sstep=h=>h<=0?0:h>=1?1:h*h*(3-2*h);

  // A resize happens before drawing, so the canvas is never shown blank.
  if(now-startT>3000&&!document.hidden&&idleFrames===0&&ft>0&&ft<250){ftAcc+=ft;ftN++;}
